# Builds TimeDisplay into a standalone executable on Windows, macOS and Linux
# using Compile_TimeDisplay.py (PyInstaller), then uploads each build as an artifact.

name: Build TimeDisplay

on:
  label:
    types:
      - created
  workflow_dispatch:   # lets you run the build manually from the Actions tab

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # one OS failing won't cancel the others
      matrix:
        include:
          - os: ubuntu-latest
            build_dir: LINUX
          - os: macos-latest
            build_dir: MACOS
          - os: windows-latest
            build_dir: WIN32

    defaults:
      run:
        shell: bash   # the scripts below use bash syntax, including on Windows

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pillow is required because the script passes a .png icon to PyInstaller
          pip install pyqt6 pyqt6-sip pyinstaller pillow
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build executable using Python compile file
        run: |
          # The script ends with input("Press [ENTER]..."), which would fail with
          # EOFError in CI, so pipe a newline into it.
          echo "" | python Compile_TimeDisplay.py

      # The script writes to CompileBuild/<PLATFORM>/dist, not ./dist
      - name: Package build (macOS)
        if: runner.os == 'macOS'
        run: |
          cd CompileBuild/MACOS/dist
          # ditto keeps the .app bundle's symlinks and permissions intact
          ditto -c -k --keepParent TimeDisplay.app ../../../TimeDisplay-macOS.zip

      - name: Package build (Linux)
        if: runner.os == 'Linux'
        run: |
          # tar keeps the executable bit, which upload-artifact would otherwise drop
          tar -czf TimeDisplay-Linux.tar.gz -C CompileBuild/LINUX/dist TimeDisplay

      - name: Upload build artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: TimeDisplay-macOS
          path: TimeDisplay-macOS.zip
          if-no-files-found: error

      - name: Upload build artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: TimeDisplay-Linux
          path: TimeDisplay-Linux.tar.gz
          if-no-files-found: error

      - name: Upload build artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: TimeDisplay-Windows
          path: CompileBuild/${{ matrix.build_dir }}/dist/
          if-no-files-found: error
