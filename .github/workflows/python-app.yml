# Builds TimeDisplay into a standalone executable on Windows, macOS and Linux
# using Compile_TimeDisplay.py (PyInstaller), then attaches the builds to the
# GitHub Release for the pushed tag.

name: Build TimeDisplay

on:
  push:
    tags:
      - "v*"          # e.g. git tag v1.2.0 && git push origin v1.2.0
  workflow_dispatch:  # manual run from the Actions tab
    inputs:
      tag:
        description: "Existing tag to attach the builds to (e.g. v1.2.0)"
        required: true

permissions:
  contents: write     # required to create a release and upload assets

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyqt6 pyqt6-sip pyinstaller pillow
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build executable using Python compile file
        run: |
          # Pipe a newline so any input() prompt in the script doesn't fail in CI
          echo "" | python Compile_TimeDisplay.py

      # Find wherever PyInstaller put its output instead of hard-coding a path,
      # so the workflow keeps working if the compile script's paths change.
      - name: Locate build output
        run: |
          python - << 'PY'
          import os, sys

          skip = {".git", "build", "__pycache__", "venv", ".venv"}
          candidates = []
          for root, dirs, files in os.walk("."):
              if "dist" in dirs:
                  path = os.path.join(root, "dist")
                  if os.listdir(path):
                      candidates.append(path)
              # don't descend into skipped folders or into dist itself
              dirs[:] = [d for d in dirs if d not in skip and d != "dist"]

          if not candidates:
              print("::error::No non-empty 'dist' folder found after compiling. Workspace tree:")
              for root, dirs, files in os.walk("."):
                  dirs[:] = [d for d in dirs if d != ".git"]
                  print(root)
              sys.exit(1)

          dist = max(candidates, key=os.path.getmtime)   # newest one wins
          print("Build output folder:", dist)
          for item in os.listdir(dist):
              print("  ", item)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"DIST_DIR={os.path.abspath(dist)}\n")
          PY

      - name: Package build (macOS)
        if: runner.os == 'macOS'
        run: |
          cd "$DIST_DIR"
          APP=$(ls -d *.app 2>/dev/null | head -n 1)
          if [ -n "$APP" ]; then
            # ditto keeps the .app bundle's symlinks and permissions intact
            ditto -c -k --keepParent "$APP" "$GITHUB_WORKSPACE/TimeDisplay-macOS.zip"
          else
            ditto -c -k . "$GITHUB_WORKSPACE/TimeDisplay-macOS.zip"
          fi

      - name: Package build (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czf TimeDisplay-Linux.tar.gz -C "$DIST_DIR" .

      - name: Package build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:DIST_DIR\*" -DestinationPath TimeDisplay-Windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeDisplay-${{ matrix.label }}
          path: |
            TimeDisplay-*.zip
            TimeDisplay-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List files to upload
        run: ls -la release-files

      - name: Attach builds to the release for this tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: release-files/*
          fail_on_unmatched_files: true
