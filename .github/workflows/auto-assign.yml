name: Auto Assign
on:
  issues:
    types: [opened]
  # pull_request_target (not pull_request) so PRs from forks also get a write token.
  # Safe here: this job never checks out or runs code from the PR.
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign to repo owner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          ASSIGNEE: LordPercivalXII
        # PRs are issues in the GitHub API, so one endpoint covers both events.
        run: gh api -X POST "repos/$GH_REPO/issues/$NUMBER/assignees" -f "assignees[]=$ASSIGNEE"
